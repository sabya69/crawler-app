<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Website Feedback Form</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(to right, #f8f9fa, #e9ecef);
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 50px auto;
      background-color: #ffffff;
      padding: 30px 40px;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #343a40;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #6c757d;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #495057;
    }

    input[type="text"],
    input[type="email"],
    select,
    textarea {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 20px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 16px;
      background-color: #f8f9fa;
    }

    input::placeholder,
    textarea::placeholder {
      color: #adb5bd;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .rating {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .rating input[type="radio"] {
      display: none;
    }

    .rating label {
      font-size: 24px;
      color: #ccc;
      cursor: pointer;
      transition: color 0.3s ease;
    }

    .rating input[type="radio"]:checked + label,
    .rating label:hover,
    .rating label:hover ~ label {
      color: #ffc107;
    }

    .submit-btn {
      display: block;
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .submit-btn:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Website Feedback Form</h1>
    <p class="subtitle">We value your feedback to improve your experience!</p>

    <form id="feedbackForm" action="/submit_feedback" method="POST">
      <div>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required />
      </div>
      <div>
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required />
      </div>
      <div>
        <label for="experience">How was your overall experience?</label>
        <select id="experience" name="experience" required>
          <option value="">Select...</option>
          <option value="Excellent">Excellent</option>
          <option value="Good">Good</option>
          <option value="Average">Average</option>
          <option value="Poor">Poor</option>
        </select>
      </div>
      <div>
        <label>Rate our website:</label>
        <div class="rating">
          <input type="radio" id="star5" name="rating" value="5" required />
          <label for="star5" aria-label="5 stars">★</label>
          <input type="radio" id="star4" name="rating" value="4" />
          <label for="star4" aria-label="4 stars">★</label>
          <input type="radio" id="star3" name="rating" value="3" />
          <label for="star3" aria-label="3 stars">★</label>
          <input type="radio" id="star2" name="rating" value="2" />
          <label for="star2" aria-label="2 stars">★</label>
          <input type="radio" id="star1" name="rating" value="1" />
          <label for="star1" aria-label="1 star">★</label>
        </div>
      </div>
      <div>
        <label for="suggestions">Suggestions or Comments:</label>
        <textarea id="suggestions" name="suggestions" placeholder="Share your thoughts..."></textarea>
      </div>
      <button type="submit" class="submit-btn">Submit Feedback</button>
    </form>
  </div>
</body>
</html>
